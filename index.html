<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Planification FHGES S1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Literata:opsz,wght@7..72,500;7..72,650&display=swap">
<style>
:root{
  --fond:#F3F5F0;--surface:#FFFFFF;--surface-2:#EDF1EA;--surface-3:#E2E8DF;
  --encre:#1B251E;--encre-2:#3B4940;--doux:#5A6A5F;--pale:#7D8B81;
  --trait:#D6DED3;--trait-fort:#B5C1B0;
  --foret:#3A5A40;--foret-fort:#2B4430;--foret-clair:#E1EBDF;--sur-foret:#FFFFFF;
  --lien:#2C5E8A;--focus:#1F6FD1;--danger:#A3372A;--danger-clair:#FBE8E4;--sur-danger:#FFFFFF;
  --f-comp:#2E4A62;--f-sav:#5B3A6B;--f-sf:#2F5D50;--f-rep:#7A4B1E;--sur-fam:#FFFFFF;
  --st-prevu:#BDD7EE;--st-prevu-t:#1F4E78;
  --st-partie:#F8CBAD;--st-partie-t:#833C0B;
  --st-evalue:#548235;--st-evalue-t:#FFFFFF;
  --st-vu:#C6EFCE;--st-vu-t:#006100;
  --st-cours:#FFE699;--st-cours-t:#6B5200;
  --st-non:#FFFFFF;--st-non-t:#5A6A5F;--st-non-b:#D6DED3;
  --m-x:#9DC3E6;--m-x-t:#1F3864;--m-x-c:#EAF2FB;
  --m-p:#F4B183;--m-p-t:#7A3509;--m-p-c:#FDF0E7;
  --m-e:#548235;--m-e-t:#FFFFFF;--m-e-c:#E6F0DE;
  --fond-vue:#EFF8F0;--fond-cours:#FFF8DC;
  --voile:rgba(15,22,17,.40);
  --ombre-1:0 1px 2px rgba(27,37,30,.06);
  --ombre-2:0 2px 6px rgba(27,37,30,.07),0 14px 36px rgba(27,37,30,.13);
  --r:10px;--r-s:7px;--r-xs:5px;
  --ff:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --ff-titre:"Literata",Georgia,"Times New Roman",serif;
  --ff-code:"Atkinson Hyperlegible Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --fond:#0F1511;--surface:#161F19;--surface-2:#1C271F;--surface-3:#253229;
  --encre:#E3EAE4;--encre-2:#C1CDC4;--doux:#97A69B;--pale:#76857A;
  --trait:#29362C;--trait-fort:#3A4B3E;
  --foret:#8FBF97;--foret-fort:#A8D0AE;--foret-clair:#1D2E23;--sur-foret:#0D1510;
  --lien:#8CBCE6;--focus:#6FA8F0;--danger:#E0796B;--danger-clair:#3A1C18;--sur-danger:#1A0806;
  --f-comp:#3A5874;--f-sav:#684A7A;--f-sf:#37695B;--f-rep:#86592B;--sur-fam:#F2F5F2;
  --st-prevu:#1F3A56;--st-prevu-t:#C3DDF5;
  --st-partie:#4E2E1C;--st-partie-t:#F7CCAE;
  --st-evalue:#6E9E4A;--st-evalue-t:#0C1709;
  --st-vu:#1F4A2C;--st-vu-t:#BDEBC8;
  --st-cours:#4D4113;--st-cours-t:#FFE38F;
  --st-non:#161F19;--st-non-t:#97A69B;--st-non-b:#29362C;
  --m-x:#29466B;--m-x-t:#CFE2F6;--m-x-c:#17222F;
  --m-p:#5A3520;--m-p-t:#F8CDAF;--m-p-c:#281C14;
  --m-e:#6E9E4A;--m-e-t:#0C1709;--m-e-c:#1A2716;
  --fond-vue:#15241A;--fond-cours:#262211;
  --voile:rgba(0,0,0,.55);
  --ombre-1:0 1px 2px rgba(0,0,0,.35);
  --ombre-2:0 2px 6px rgba(0,0,0,.35),0 14px 36px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --fond:#0F1511;--surface:#161F19;--surface-2:#1C271F;--surface-3:#253229;
  --encre:#E3EAE4;--encre-2:#C1CDC4;--doux:#97A69B;--pale:#76857A;
  --trait:#29362C;--trait-fort:#3A4B3E;
  --foret:#8FBF97;--foret-fort:#A8D0AE;--foret-clair:#1D2E23;--sur-foret:#0D1510;
  --lien:#8CBCE6;--focus:#6FA8F0;--danger:#E0796B;--danger-clair:#3A1C18;--sur-danger:#1A0806;
  --f-comp:#3A5874;--f-sav:#684A7A;--f-sf:#37695B;--f-rep:#86592B;--sur-fam:#F2F5F2;
  --st-prevu:#1F3A56;--st-prevu-t:#C3DDF5;
  --st-partie:#4E2E1C;--st-partie-t:#F7CCAE;
  --st-evalue:#6E9E4A;--st-evalue-t:#0C1709;
  --st-vu:#1F4A2C;--st-vu-t:#BDEBC8;
  --st-cours:#4D4113;--st-cours-t:#FFE38F;
  --st-non:#161F19;--st-non-t:#97A69B;--st-non-b:#29362C;
  --m-x:#29466B;--m-x-t:#CFE2F6;--m-x-c:#17222F;
  --m-p:#5A3520;--m-p-t:#F8CDAF;--m-p-c:#281C14;
  --m-e:#6E9E4A;--m-e-t:#0C1709;--m-e-c:#1A2716;
  --fond-vue:#15241A;--fond-cours:#262211;
  --voile:rgba(0,0,0,.55);
  --ombre-1:0 1px 2px rgba(0,0,0,.35);
  --ombre-2:0 2px 6px rgba(0,0,0,.35),0 14px 36px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--fond);color:var(--encre)}
body{font-family:var(--ff);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{margin:0;font-weight:700;text-wrap:balance}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.code,.num{font-family:var(--ff-code);font-variant-numeric:tabular-nums}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.page{max-width:1240px;margin-inline:auto;padding-inline:20px}
@media (max-width:640px){.page{padding-inline:16px}}
.contenu{padding-block:4px 64px}
.ico{flex:none;display:block}

/* ----------------------------------------------------------- barre */
.barre{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--trait)}
.barre-l1{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;padding-block:10px 4px;flex-wrap:wrap}
.identite{display:flex;align-items:center;gap:11px;min-width:0}
.logo{flex:none;width:36px;height:36px;border-radius:9px;background:var(--foret);color:var(--sur-foret);display:grid;place-items:center}
.identite-txt{display:flex;flex-direction:column;min-width:0}
.identite-nom{font-family:var(--ff-titre);font-weight:650;font-size:18px;line-height:1.15}
.cahier-sel{position:relative}
.cahier-btn{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:1px 0;color:var(--doux);font-size:13px;font-weight:600;max-width:100%}
.cahier-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cahier-btn:hover{color:var(--encre)}
.barre-actions{display:flex;align-items:center;gap:12px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--doux);white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--foret)}
.sync.envoi::before{background:var(--st-cours-t);animation:pulse 1s infinite alternate}
.sync.erreur{color:var(--danger)}
.sync.erreur::before{background:var(--danger)}
@keyframes pulse{to{opacity:.3}}
.barre-l2{display:flex;align-items:flex-end;justify-content:space-between;gap:4px 16px;flex-wrap:wrap}
.onglets{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px;max-width:100%}
.onglets::-webkit-scrollbar{display:none}
.onglet{border:0;background:none;padding:10px 12px 9px;border-bottom:3px solid transparent;color:var(--doux);font-weight:700;white-space:nowrap;border-radius:0}
.onglet:hover{color:var(--encre)}
.onglet.actif{color:var(--encre);border-bottom-color:var(--foret)}
.filtre{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-bottom:8px}
.filtre-lab{font-size:11.5px;color:var(--doux);text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-right:2px}
.puce{border:1px solid var(--trait-fort);background:var(--surface);border-radius:999px;padding:3px 11px;font-weight:700;font-size:13px;line-height:1.35}
.puce:hover{border-color:var(--foret)}
.puce.actif{background:var(--foret);border-color:var(--foret);color:var(--sur-foret)}
.puces{display:flex;flex-wrap:wrap;gap:6px}

/* ----------------------------------------------------------- boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:var(--r-s);padding:7px 13px;font-weight:700;border:1px solid transparent;white-space:nowrap;line-height:1.3}
.btn-prim{background:var(--foret);color:var(--sur-foret)}
.btn-prim:hover:not(:disabled){background:var(--foret-fort)}
.btn-sec{background:var(--surface);border-color:var(--trait-fort)}
.btn-sec:hover:not(:disabled){background:var(--surface-2)}
.btn-danger{background:var(--danger);color:var(--sur-danger)}
.btn-lien{background:none;border:0;padding:0;color:var(--lien);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.btn-ico{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:var(--r-s);border:0;background:none;color:var(--doux);flex:none}
.btn-ico:hover:not(:disabled){background:var(--surface-2);color:var(--encre)}
@media (max-width:640px){
  .barre{position:static}
  .barre-l1{flex-wrap:nowrap}
  .identite{flex:1 1 auto}
  .onglet{padding:10px 7px 9px;font-size:13.5px}
}
@media (max-width:520px){.btn-export span{display:none}.sync{font-size:0;gap:0}}

/* ----------------------------------------------------------- éléments communs */
.seg{display:inline-flex;border:1px solid var(--trait-fort);border-radius:var(--r-s);overflow:hidden;background:var(--surface);flex:none}
.seg-b{border:0;background:none;padding:6px 12px;font-weight:700;font-size:13px;color:var(--doux);line-height:1.3}
.seg-b+.seg-b{border-left:1px solid var(--trait-fort)}
.seg-b:hover:not(:disabled){color:var(--encre);background:var(--surface-2)}
.seg-b.actif{background:var(--surface-3);color:var(--encre)}
.seg-b.actif.e-vue{background:var(--st-vu);color:var(--st-vu-t)}
.seg-b.actif.e-en-cours{background:var(--st-cours);color:var(--st-cours-t)}
.seg-b.actif.mode{background:var(--foret);color:var(--sur-foret)}
.seg-s .seg-b{padding:4px 9px;font-size:12.5px}
.pilule{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap;line-height:1.4}
.st-prevu{background:var(--st-prevu);color:var(--st-prevu-t)}
.st-partie{background:var(--st-partie);color:var(--st-partie-t)}
.st-evalue{background:var(--st-evalue);color:var(--st-evalue-t)}
.st-vu{background:var(--st-vu);color:var(--st-vu-t)}
.st-cours{background:var(--st-cours);color:var(--st-cours-t)}
.st-non{background:var(--st-non);color:var(--st-non-t);box-shadow:inset 0 0 0 1px var(--st-non-b)}
.m-x{background:var(--m-x);color:var(--m-x-t)}
.m-p{background:var(--m-p);color:var(--m-p-t)}
.m-e{background:var(--m-e);color:var(--m-e-t)}
.tag{display:inline-flex;align-items:center;border-radius:var(--r-xs);padding:1px 7px;font-size:12px;font-weight:700;background:var(--surface-3);color:var(--encre-2);white-space:nowrap}
.aide{font-size:12.5px;color:var(--doux)}
.vide{color:var(--doux);font-style:italic}
.bandeau{display:flex;gap:10px 14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--foret-clair);border-radius:var(--r);padding:10px 14px;margin-top:16px;color:var(--encre)}
.bandeau p{flex:1 1 280px}
.bandeau-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.etat-plein{padding-block:72px;max-width:600px;margin-inline:auto;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.etat-plein h1{font-family:var(--ff-titre);font-size:26px;font-weight:650}
.etat-plein p{color:var(--encre-2)}
.roue{width:28px;height:28px;border-radius:50%;border:3px solid var(--trait);border-top-color:var(--foret);animation:tourne .8s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}
.titre-vue{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;margin-block:22px 12px}
.titre-vue h1,.titre-vue h2{font-family:var(--ff-titre);font-size:22px;font-weight:650}

/* ----------------------------------------------------------- vue d'ensemble */
.resume{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:18px}
.chiffre{background:var(--surface);border:1px solid var(--trait);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:9px;min-width:0}
.chiffre h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--doux);font-weight:800}
.chiffre-val{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.chiffre-val strong{font-family:var(--ff-titre);font-size:34px;font-weight:650;line-height:1;font-variant-numeric:tabular-nums}
.chiffre-val span{color:var(--doux);font-weight:600}
.pile{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--surface-3)}
.pile>span{height:100%;min-width:3px}
.leg{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12.5px;color:var(--encre-2)}
.leg li{display:inline-flex;align-items:center;gap:5px}
.pastille{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.lignes-classes{display:flex;flex-direction:column;gap:7px}
.lc{display:grid;grid-template-columns:minmax(3em,auto) minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px}
.lc b{font-weight:800}
.lc4{grid-template-columns:minmax(2.6em,auto) minmax(40px,1fr) 4.4em 4.4em}
.lc4 .lc-n{text-align:right}
.lc-tete{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--doux);font-weight:800}
.lc-tete span{text-align:right}
.lc .pile{height:8px}
.lc-n{color:var(--doux);font-family:var(--ff-code);font-size:12px;white-space:nowrap}
.carte-tete{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;margin-block:26px 12px}
.carte-tete h2{font-family:var(--ff-titre);font-size:21px;font-weight:650}
.carte-cmd{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.familles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:1020px){.familles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:680px){.familles{grid-template-columns:minmax(0,1fr)}}
.col-fam{display:flex;flex-direction:column;gap:16px;min-width:0}
.famille{background:var(--surface);border:1px solid var(--trait);border-radius:var(--r);overflow:hidden}
.famille-tete{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:8px 12px;background:var(--fam);color:var(--sur-fam)}
.famille-tete h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:800}
.famille-compte{font-family:var(--ff-code);font-size:12px;font-weight:600}
.sg{padding:9px 12px 3px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--doux);font-weight:800}
.tuiles{display:flex;flex-direction:column;gap:2px;padding:3px 8px 10px}
.tuile{display:grid;grid-template-columns:2.9em 1.1em minmax(0,1fr);align-items:center;column-gap:6px;width:100%;border:0;border-radius:var(--r-xs);padding:4px 8px;text-align:left;min-height:30px;font-size:13px;line-height:1.25}
.tuile:hover{box-shadow:inset 0 0 0 1.5px currentColor}
.tuile.st-non{background:var(--surface-2);box-shadow:none}
.tuile.st-non:hover{box-shadow:inset 0 0 0 1.5px var(--trait-fort)}
.t-code{font-family:var(--ff-code);font-weight:600;font-size:12.5px}
.t-sym{text-align:center;font-size:12px}
.bilan{margin-top:22px}
.bilan>summary{cursor:pointer;font-weight:700;color:var(--encre-2);padding:6px 0}
.bilan>summary:hover{color:var(--encre)}
.tab-wrap{overflow-x:auto;border:1px solid var(--trait);border-radius:var(--r);background:var(--surface);margin-top:8px}
table.tab{border-collapse:collapse;width:100%;font-size:13px}
.tab th,.tab td{padding:6px 10px;border-bottom:1px solid var(--trait);text-align:left;vertical-align:top}
.tab tr:last-child td{border-bottom:0}
.tab thead th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--doux);background:var(--surface-2);font-weight:800;white-space:nowrap}
.tab td.n,.tab th.n{text-align:center;font-family:var(--ff-code);font-variant-numeric:tabular-nums;white-space:nowrap}
.tab td.fort{font-weight:800}
.tab tr.sect td{background:var(--surface-2);font-weight:800;font-size:11px;letter-spacing:.08em;color:var(--doux)}
.tab .etat-cell,.tab .nw{white-space:nowrap}

/* ----------------------------------------------------------- séquences */
.outils{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;margin-block:18px 14px}
.recherche{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--trait-fort);border-radius:var(--r-s);padding:0 10px;min-width:0;flex:1 1 220px;max-width:340px;color:var(--doux)}
.recherche:focus-within{border-color:var(--focus)}
.recherche input{border:0;background:none;padding:7px 0;width:100%;outline:none;color:var(--encre)}
.select{border:1px solid var(--trait-fort);background:var(--surface);border-radius:var(--r-s);padding:7px 10px;max-width:100%}
.note-filtre{margin:-4px 0 12px;font-size:13px;color:var(--doux)}
.seq{background:var(--surface);border:1px solid var(--trait);border-radius:var(--r);margin-bottom:16px}
.seq-tete{display:flex;justify-content:space-between;gap:8px 14px;padding:14px 12px 12px 16px;align-items:flex-start;flex-wrap:wrap}
.seq-tete-txt{min-width:0;flex:1 1 320px;display:flex;flex-direction:column;gap:5px}
.seq-titre{font-family:var(--ff-titre);font-size:19px;font-weight:650;line-height:1.25}
.seq-meta{color:var(--doux);font-size:13px;display:flex;flex-wrap:wrap;gap:3px 14px}
.seq-prog{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--encre-2)}
.seq-prog b{font-weight:800}
.seq-actions{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.etapes{border-top:1px solid var(--trait)}
.etape{display:grid;grid-template-columns:26px minmax(0,1fr) auto auto;gap:8px 14px;padding:12px 10px 12px 14px;align-items:start;border-top:1px solid var(--trait)}
.etape:first-child{border-top:0}
.etape.est-vue{background:var(--fond-vue)}
.etape.est-cours{background:var(--fond-cours)}
.seq .etape:last-child{border-radius:0 0 var(--r) var(--r)}
.etape-num{font-family:var(--ff-code);color:var(--pale);font-size:12px;padding-top:2px}
.etape-tete{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.etape-titre{font-size:14.5px;font-weight:800;line-height:1.3}
.etape-rem{color:var(--encre-2);font-size:13px;margin-top:3px;max-width:78ch}
.marques{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.marque{border:0;border-radius:var(--r-xs);padding:2px 7px;font-family:var(--ff-code);font-size:12px;font-weight:600;display:inline-flex;gap:5px;align-items:baseline;line-height:1.45}
.marque:hover{box-shadow:inset 0 0 0 1.5px currentColor}
.marque .m-l{font-weight:400;opacity:.85}
.etape-vide{font-size:12.5px;color:var(--doux);font-style:italic;margin-top:6px}
.etape-suivi{display:flex;flex-direction:column;align-items:flex-end;gap:5px;padding-top:1px}
.suivi-detail{border:0;background:none;padding:0;color:var(--doux);font-size:12px;text-decoration:underline dotted;text-underline-offset:3px;white-space:nowrap}
.suivi-detail:hover{color:var(--encre)}
.badges{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;max-width:250px}
.badge{border:1px solid var(--trait-fort);background:var(--surface);border-radius:999px;padding:2px 9px;font-weight:800;font-size:12.5px;display:inline-flex;gap:4px;align-items:center;line-height:1.35}
.badge:hover{border-color:var(--foret)}
.badge.b-vue{background:var(--st-vu);color:var(--st-vu-t);border-color:transparent}
.badge.b-en-cours{background:var(--st-cours);color:var(--st-cours-t);border-color:transparent}
.etape-actions{display:flex;gap:2px}
@media (max-width:780px){
  .etape{grid-template-columns:22px minmax(0,1fr) auto}
  .etape-suivi{grid-column:2/-1;grid-row:2;align-items:flex-start}
  .badges{justify-content:flex-start;max-width:none}
  .etape-actions{grid-column:3;grid-row:1}
}
.menu{position:relative}
.menu-liste{position:absolute;right:0;top:calc(100% + 4px);z-index:40;background:var(--surface);border:1px solid var(--trait);border-radius:var(--r-s);box-shadow:var(--ombre-2);min-width:210px;padding:5px;display:flex;flex-direction:column}
.menu-liste.gauche{right:auto;left:0}
.menu-it{border:0;background:none;text-align:left;padding:8px 10px;border-radius:var(--r-xs);font-weight:600;white-space:nowrap}
.menu-it:hover:not(:disabled){background:var(--surface-2)}
.menu-it.danger{color:var(--danger)}
.menu-it.actif{color:var(--foret);font-weight:800}
.menu-sep{height:1px;background:var(--trait);margin:4px 2px}

/* ----------------------------------------------------------- tiroirs et dialogues */
.voile{position:fixed;inset:0;z-index:50;background:var(--voile);display:flex;justify-content:flex-end}
.voile.centre{align-items:center;justify-content:center;padding:16px;z-index:60}
.tiroir{background:var(--fond);width:min(780px,100%);height:100%;display:flex;flex-direction:column;box-shadow:var(--ombre-2);animation:glisse .18s ease-out}
@keyframes glisse{from{transform:translateX(28px)}}
.tiroir-tete{background:var(--surface);border-bottom:1px solid var(--trait);padding:14px 14px 12px 20px;padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.tiroir-tete h2{font-family:var(--ff-titre);font-size:20px;font-weight:650;line-height:1.25}
.tiroir-sur{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--doux);font-weight:800;margin-bottom:3px}
.tiroir-corps{flex:1;overflow:auto;padding:18px 20px 28px;overscroll-behavior:contain}
.tiroir-pied{background:var(--surface);border-top:1px solid var(--trait);padding:12px 20px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.pied-d{display:flex;gap:8px;margin-left:auto}
.dialogue{background:var(--surface);border-radius:var(--r);width:min(540px,100%);max-height:calc(100% - 16px);display:flex;flex-direction:column;box-shadow:var(--ombre-2);animation:monte .16s ease-out}
.dialogue.large{width:min(680px,100%)}
@keyframes monte{from{transform:translateY(8px)}}
.dlg-tete{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 14px 6px 20px}
.dlg-tete h2{font-family:var(--ff-titre);font-size:19px;font-weight:650;line-height:1.3}
.dlg-corps{padding:6px 20px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dlg-pied{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 16px;border-top:1px solid var(--trait);flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.tiroir,.dialogue{animation:none}.sync.envoi::before,.roue{animation:none}}
.champ{display:flex;flex-direction:column;gap:5px}
.champ>label,.champ-lab{font-size:12.5px;font-weight:800;color:var(--encre-2)}
.champs{display:flex;flex-direction:column;gap:16px}
.champs-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.saisie{border:1px solid var(--trait-fort);background:var(--surface);border-radius:var(--r-s);padding:8px 10px;width:100%;min-width:0}
.saisie:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
textarea.saisie{min-height:74px;resize:vertical;line-height:1.45}
.coche{display:inline-flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.coche input{width:17px;height:17px;accent-color:var(--foret);margin:0}
.erreur{color:var(--danger);font-weight:700;font-size:13px}
.encadre{background:var(--surface);border:1px solid var(--trait);border-radius:var(--r);padding:14px 16px}
.bloc-titre{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--doux);font-weight:800;margin:22px 0 8px}
.attendu{background:var(--foret-clair);border-radius:var(--r-s);padding:12px 14px}
.attendu-lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--foret);margin-bottom:4px}

/* choix des items */
.choix-barre{position:sticky;top:-18px;margin-top:-6px;background:var(--fond);padding-block:10px 8px;z-index:3;display:flex;flex-direction:column;gap:8px}
.choix-barre-l{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.choix-compte{font-size:13px;color:var(--encre-2);font-weight:700}
.choix-fam{margin-top:10px;background:var(--surface);border:1px solid var(--trait);border-radius:var(--r);overflow:hidden}
.choix-fam>h4{font-size:12px;text-transform:uppercase;letter-spacing:.08em;background:var(--fam);color:var(--sur-fam);font-weight:800;padding:7px 12px;display:flex;justify-content:space-between}
.choix-sg{padding:8px 12px 2px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--doux);font-weight:800}
.choix{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:2px 10px;padding:5px 8px 5px 10px;border-top:1px solid var(--trait)}
.choix.c-x{background:var(--m-x-c)}.choix.c-p{background:var(--m-p-c)}.choix.c-e{background:var(--m-e-c)}
.choix-info{border:0;background:none;text-align:left;display:grid;grid-template-columns:3.3em minmax(0,1fr) auto;gap:8px;padding:3px 0;align-items:center;min-width:0}
.choix-code{font-family:var(--ff-code);font-weight:600;font-size:13px}
.choix-nom{font-size:13.5px}
.choix-fl{color:var(--pale);transition:transform .15s}
.choix-info[aria-expanded="true"] .choix-fl{transform:rotate(180deg)}
.mqs{display:inline-flex}
.mq{width:34px;height:30px;border:1px solid var(--trait-fort);background:var(--surface);font-weight:700;font-family:var(--ff-code);font-size:13px;color:var(--doux);padding:0}
.mq:first-child{border-radius:var(--r-s) 0 0 var(--r-s)}
.mq:last-child{border-radius:0 var(--r-s) var(--r-s) 0}
.mq+.mq{border-left:0}
.mq:hover{color:var(--encre);background:var(--surface-2)}
.mq.actif.mq-x{background:var(--m-x);color:var(--m-x-t);border-color:var(--m-x)}
.mq.actif.mq-p{background:var(--m-p);color:var(--m-p-t);border-color:var(--m-p)}
.mq.actif.mq-e{background:var(--m-e);color:var(--m-e-t);border-color:var(--m-e)}
.choix-detail{grid-column:1/-1;font-size:13px;color:var(--encre-2);padding:2px 4px 8px 3.6em;display:flex;flex-direction:column;gap:6px;max-width:80ch}
@media (max-width:560px){.choix{grid-template-columns:minmax(0,1fr)}.mqs{justify-self:end}.choix-detail{padding-left:4px}}

/* ----------------------------------------------------------- items */
.items-liste{background:var(--surface);border:1px solid var(--trait);border-radius:var(--r);overflow:hidden}
.il,.il-tete{display:grid;grid-template-columns:4.3em minmax(0,1fr) 10.5em 9.5em 8.2em 7.5em;grid-template-areas:"code nom plan vu per ou";gap:6px 12px;align-items:center;padding:8px 14px}
.il-tete{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--doux);background:var(--surface-2);font-weight:800}
.il-fam{padding:8px 14px;background:var(--fam);color:var(--sur-fam);font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.il{border:0;border-top:1px solid var(--trait);background:none;width:100%;text-align:left}
.il:hover{background:var(--surface-2)}
.il-code{grid-area:code;font-family:var(--ff-code);font-weight:600}
.il-nom{grid-area:nom;min-width:0;display:flex;flex-direction:column}
.il-nom small{color:var(--doux);font-size:12px}
.il-plan{grid-area:plan}.il-vu{grid-area:vu}
.il-per{grid-area:per;font-family:var(--ff-code);font-size:12px;display:flex;gap:4px;flex-wrap:wrap}
.per-on,.per-off{border-radius:var(--r-xs);padding:1px 5px;line-height:1.35}
.per-on{background:var(--st-prevu);color:var(--st-prevu-t);font-weight:600}
.per-off{color:var(--pale);box-shadow:inset 0 0 0 1px var(--trait)}
.il-ou{grid-area:ou;font-size:12.5px;color:var(--encre-2);display:flex;gap:6px;align-items:center;justify-content:space-between}
.il-note{color:var(--foret)}
.il-plan,.il-vu{justify-self:start}
@media (max-width:820px){
  .il-tete{display:none}
  .il{grid-template-columns:3.6em minmax(0,1fr) minmax(0,1fr);grid-template-areas:"code nom nom" "code plan vu" "code per ou"}
}
.ou-liste{display:flex;flex-direction:column;gap:8px}
.ou{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:start;background:var(--surface);border:1px solid var(--trait);border-radius:var(--r-s);padding:9px 12px}
.ou-seq{font-size:12px;color:var(--doux)}
.ou-et{font-weight:800}
.ou-cl{grid-column:2;display:flex;flex-wrap:wrap;gap:4px}

/* ----------------------------------------------------------- paramètres */
.params{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;margin-top:18px;align-items:start}
.bloc{background:var(--surface);border:1px solid var(--trait);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.bloc>h2{font-family:var(--ff-titre);font-size:18px;font-weight:650}
.bloc>p{color:var(--encre-2)}
.liste-ed{display:flex;flex-direction:column}
.liste-ed li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0 5px 2px;border-bottom:1px solid var(--trait)}
.liste-ed li:first-child{border-top:1px solid var(--trait)}
.liste-ed .nom{font-weight:800}
.ajout{display:flex;gap:8px}
.cahiers li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--trait)}
.cahiers li:first-child{border-top:1px solid var(--trait)}
.actions-col{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.leg-tab{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center;font-size:13px}
.leg-tab .pilule,.leg-tab .marque{justify-self:start}

/* ----------------------------------------------------------- toasts */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;gap:8px;width:min(520px,calc(100% - 32px));pointer-events:none}
.toast{pointer-events:auto;background:var(--encre);color:var(--fond);border-radius:var(--r-s);padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;box-shadow:var(--ombre-2);font-weight:700}
.toast.erreur{background:var(--danger);color:var(--sur-danger)}
.toast button{background:none;border:0;color:inherit;text-decoration:underline;font-weight:800;padding:0}
</style>

e quotidienne (ex. : culture et arts, fêtes, rites, calendrier, assistance aux pauvres…).","attendu":"Exemplifier l’influence que la Chrétienté et l’Islam médiévaux exercent sur la vie quotidienne et sur l’art."},{"code":"S8","famille":"Savoirs","discipline":"Histoire","court":"Islam : naissance, expansion, diffusion","intitule":"L'Islam : naissance, expansion et diffusion de l’Islam.","attendu":""},{"code":"S9","famille":"Savoirs","discipline":"Histoire","court":"Islam : vie quotidienne","intitule":"L'Islam : vie quotidienne (ex. : culture et arts, fêtes, rites, aumône…).","attendu":"Exemplifier l’influence que la Chrétienté et l’Islam médiévaux exercent sur la vie quotidienne et sur l’art."},{"code":"S10","famille":"Savoirs","discipline":"Histoire","court":"Chrétiens, juifs, musulmans : relations","intitule":"Les relations entre chrétiens, juifs et musulmans.","attendu":"Exemplifier des apports réciproques, des cohabitations pacifiques et des conflits entre les chrétiens, les juifs et les musulmans au Moyen Âge."},{"code":"S11","famille":"Savoirs","discipline":"Histoire","court":"Catholicisme et protestantisme","intitule":"Catholicisme et protestantisme.","attendu":"Expliquer une controverse à propos des pratiques religieuses entre l’Église catholique et les théories de Luther."},{"code":"S12","famille":"Savoirs","discipline":"Histoire","court":"Fin de l'Ancien Régime : la DDHC","intitule":"Remise en cause de la société d’Ancien Régime : Déclaration des droits de l’homme et du citoyen (tolérance religieuse et liberté de conscience et de pensée).","attendu":""},{"code":"S13","famille":"Savoirs","discipline":"Histoire","court":"Liberté de culte et d'opinion (Constitution)","intitule":"Liberté de culte et d’opinion inscrite dans la Constitution.","attendu":"Expliquer des changements induits par la Constitution sur le plan des convictions religieuses et philosophiques."},{"code":"S14","famille":"Savoirs","discipline":"Géographie","court":"Croissance démographique","in ironnementaux, sociaux, etc.)."},{"code":"S21","famille":"Savoirs","discipline":"Éco. et sociale","court":"E-commerce","intitule":"E-commerce.","attendu":"Distinguer commerce traditionnel et e-commerce du point de vue tant du consommateur (accès, prix, etc.) que de leurs impacts (environnementaux, sociaux, etc.)."},{"code":"S22","famille":"Savoirs","discipline":"Éco. et sociale","court":"Consommation collaborative","intitule":"Consommation collaborative.","attendu":"Exemplifier des pratiques de consommation collaborative et d’e-commerce différentes."},{"code":"S23","famille":"Savoirs","discipline":"Éco. et sociale","court":"Marché : offre, demande, prix d'équilibre","intitule":"Notions économiques de marché : offre, demande et prix d'équilibre.","attendu":"Exemplifier des facteurs qui influencent l’offre et la demande."},{"code":"S24","famille":"Savoirs","discipline":"Éco. et sociale","court":"Marché collaboratif numérique","intitule":"Marché collaboratif via le numérique.","attendu":"Comparer les fonctions de l’agent économique « ménages » sur le marché traditionnel et le marché collaboratif."},{"code":"S25","famille":"Savoirs","discipline":"Éco. et sociale","court":"Pouvoir","intitule":"Pouvoir.","attendu":"Identifier des modes de présentation de soi et de relation aux autres dans l’espace numérique et leurs effets sur soi et sur les autres."},{"code":"S26","famille":"Savoirs","discipline":"Éco. et sociale","court":"Insertion / exclusion","intitule":"Insertion/exclusion.","attendu":"Identifier des règles qui encadrent/limitent des pratiques virtuelles."},{"code":"S27","famille":"Savoirs","discipline":"Éco. et sociale","court":"Identité numérique","intitule":"Identité numérique.","attendu":"Expliquer en quoi les réseaux sociaux peuvent contribuer à la fois au renforcement des liens sociaux et à l’exclusion sociale."},{"code":"SF1","famille":"Savoir-faire","discipline":"Histoire","court":"Frise et tableau chronologiques","intitule":"Utiliser des représentations du temps : la frise chronologique et le tableau chronologique.","attendu":"Lire un(e) tableau/frise chronologique pour mettre en évidence une antériorité, une simultanéité, une postériorité entre deux phénomènes. Mesurer la durée d’un phénomène sur un(e) tableau/frise chronologique. Distinguer sur un(e) tableau/frise chronologique des évènements et des phénomènes. Graduer en millénaires une frise chronologique selon une échelle mesurée."},{"code":"SF2","famille":"Savoir-faire","discipline":"Histoire","court":"Outils de recherche (atlas, Internet…)","intitule":"Utiliser méthodiquement un dictionnaire, un atlas historique, un corpus documentaire, un manuel, un livre, un moteur de recherche, un portail numérique.","attendu":"Justifier la pertinence d’une page internet par rapport à une question de recherche. Sélectionner une information en référence à un repère temporel, une thématique en recourant à un portail numérique."},{"code":"SF3","famille":"Savoir-faire","discipline":"Histoire","court":"Situer une trace du passé dans le temps","intitule":"Situer une trace du passé dans le temps.","attendu":"Distinguer la date de production d’un document de la date ou de la période évoquée dans ce document."},{"code":"SF4","famille":"Savoir-faire","discipline":"Histoire","court":"Exploiter un document (question de recherche)","intitule":"Exploiter un document pour répondre à une question de recherche.","attendu":"Identifier, dans un texte court, une cause et une conséquence explicite d’un fait ou d’un changement. Comparer deux documents de nature différente pour identifier des ressemblances et des différences. Sélectionner dans un document des informations utiles pour répondre à une question de recherche. Organiser dans un tableau à double entrée des informations sélectionnées dans un document."},{"code":"SF5","famille":"Savoir-faire","discipline":"Géographie","court":"Lire un paysage","intitule":"Lire un paysage.","attendu":"Annoter une image géographique pour mettre en évidence l’évolution de l’occupation du sol, sur la base de photographies verticales prises à des moments différents pour un même lieu."},{"code":"SF6","famille":"Savoir-faire","discipline":"Géographie","court":"Lire un croquis, un plan, une carte","intitule":"Lire un croquis cartographique, un plan, une carte.","attendu":"Identifier des éléments sur la base de la légende, sur une carte à deux variables (couleurs ou figurés). Lire une information quantitative sur la base de la légende. Relever une distance et une surface, à l’aide d’un portail numérique. Associer l’emploi des figurés cartographiques de couleurs différentes à des données qualitatives ou quantitatives."},{"code":"SF7","famille":"Savoir-faire","discipline":"Géographie","court":"Annoter une représentation de l'espace","intitule":"Annoter une représentation de l'espace.","attendu":"Annoter une vue verticale pour mettre en évidence l’évolution de l’occupation du sol, sur la base d’images géographiques prises à des moments différents pour un même lieu. Réaliser un croquis cartographique pour mettre en évidence une évolution de l’occupation du sol."},{"code":"SF8","famille":"Savoir-faire","discipline":"Éco. et sociale","court":"Collecter des informations éco. et sociales","intitule":"Collecter et/ou extraire des informations économiques et sociales.","attendu":"Identifier le pouvoir qu’exercent des influenceurs au travers de pratiques numériques."},{"code":"SF9","famille":"Savoir-faire","discipline":"Éco. et sociale","court":"Analyser des informations éco. et sociales","intitule":"Analyser des informations à l'aide d'outils variés spécifiques des sciences économiques et sociales.","attendu":"Comparer différentes manières de « se mettre en scène » sur les réseaux sociaux. Identifier les variations du prix d’équilibre dans des cas concrets de rencontre entre l’offre et la demande."},{"code":"RH1","famille":"Repères","discipline":"Histoire","court":"Pluralisme des convictions en Europe","intitule":"Pluralisme des convict async function cheminsFeuilles(zip) {

  });

}

    }
    const f = norm(txt(seq.get("F" + r)));
    let classe = propreCle(txt(seq.get("B" + r)));
    if (classe && !classes.includes(classe)) { if (classes.length < MAX_CLASSES) { classes.push(classe); stats.classesAjoutees.push(classe); } else classe = ""; }
    const periode = txt(seq.get("C" + r));
    if (periode && !periodes.includes(periode) && periodes.length < MAX_PERIODES) periodes.push(periode);
    brutes.push({
      classe, periode, sequence, etape: txt(seq.get("E" + r)), remarques: String(seq.get("I" + r) == null ? "" : seq.get("I" + r)).trim(),
      etat: f === "vue" || f === "vu" ? "Vue" : f === "en cours" ? "En cours" : "Prévue",
      debut: isoDepuis(seq.get("G" + r), date1904), fin: isoDepuis(seq.get("H" + r), date1904), marques,
    });
  }
  stats.lignes = brutes.length;
  const groupes = [], index = new Map();
  for (const b of brutes) {
    const { rem, note } = separerNote(b.remarques, b.classe);
    const cle = JSON.stringify([b.sequence, b.etape, b.periode, REF.filter(it => b.marques[it.code]).map(it => it.code + b.marques[it.code]).join(","), rem]);
    let g = index.get(cle);
    if (!g || g.lignes.some(l => l.classe === b.classe)) { g = { b, rem, lignes: [] }; index.set(cle, g); groupes.push(g); }
    g.lignes.push({ classe: b.classe, etat: b.etat, debut: b.debut, fin: b.fin, note });
  }
  const etapes = groupes.map((g, i) => {
    const cl = Array.from(new Set(g.lignes.map(l => l.classe).filter(Boolean)));
    const toutes = classes.length > 0 && cl.length === classes.length;
    const suivi = {};
    for (const l of g.lignes) {
      const k = l.classe || (classes.length ? null : SANS);
      if (!k) { stats.sansClasse++; continue; }
      if (l.etat !== "Prévue" || l.debut || l.fin || l.note) suivi[k] = { etat: l.etat, debut: l.debut || null, fin: l.etat === "Prévue" ? null : (l.fin || null), note: l.note || "" };
    }
    return {
      sequence: g.b.sequence, etape: g.b.etape, periode: g.b.periode, classes: cl.length && !toutes ? cl : null,
      remarques: g.rem, items: g.b.marques, ordre: (i + 1) * 10, suivi, creeLe: maintenant(), modifieLe: maintenant(), v: 1,
    };
  });
  const sui = await grille("Suivi des items");
  const lignesLues = {};
  for (const [ref, v] of sui) { const m = /^A(\d+)$/.exec(ref); if (m && PAR_CODE[txt(v)]) lignesLues[txt(v)] = +m[1]; }
  const notes = {};
  for (const it of REF) {
    const r = Object.keys(lignesLues).length === REF.length ? lignesLues[it.code] : LIGNE_SUIVI[it.code];
    const t = String(sui.get(XL.REM + r) == null ? "" : sui.get(XL.REM + r)).trim();
    if (t) notes[it.code] = t;
  }
  return {
    cahier: { annee: txt(acc.get(XL.ANNEE)), enseignant: txt(acc.get(XL.PROF)), ecole: txt(acc.get(XL.ECOLE)), classes: classes.slice(0, MAX_CLASSES), periodes: periodes.slice(0, MAX_PERIODES) },
    etapes, notes, stats, fichier: fichier.name,
  };
}

            <div class="mqs" role="group" aria-label=${"Marque pour " + it.code}>${MARQUES.map(o => html`<button type="button" key=${o.m} class=${"mq mq-" + CL_MARQUE[o.m] + (m === o.m ? " actif" : "")} aria-pressed=${m === o.m ? "true" : "false"} title=${o.nom + " : " + o.expl} onClick=${() => marquer(it.code, o.m)}>${o.m}</button>`)}</div>
            ${ouv && html`<div class="choix-detail"><p><b>Intitulé.</b> ${it.intitule}</p><p><b>Attendu.</b> ${it.attendu || "—"}</p></div>`}
          </div>`; })}</div>`)}
      </section>`;
    })}
    ${!REF.some(visible) && html`<p class="vide" style="margin-top:12px">Aucun item ne correspond au filtre.</p>`}
  </div>`;
}

/* =================================================================== fiche séquence */
function FicheSequence({ s, cahier, t }) {
  const etapes = s.etapes.filter(e => e.sequence === t.titre).sort(parOrdre);
  const classes = classesDuCahier(cahier);
  const deg = degreSequence(etapes);
  const codes = REF.filter(it => deg[it.code]);
  const pers = Array.from(new Set(etapes.map(e => e.periode).filter(Boolean)));
  const NOM_DEG = { "é": "Évalué", x: "Abordé", p: "En partie" };
  return html`<${Tiroir} sur="Fiche séquence" titre=${t.titre} onFermer=${fermerTiroir}
    pied=${html`<span class="aide">Pour imprimer : exporte en Excel, onglet « Fiche séquence ».</span><div class="pied-d"><button type="button" class="btn btn-sec" onClick=${fermerTiroir}>Fermer</button></div>`}>
    ${!etapes.length ? html`<p class="vide">Cette séquence n\u2019a plus d\u2019étape.</p>` : html`
    <p class="aide">${pl(etapes.length, "étape", "étapes")} · ${pl(codes.length, "item travaillé", "items travaillés")}${pers.length ? " · " + pers.join(", ") : ""}</p>

      <tbody>${etapes.map((e, i) => html`<tr key=${e.id}><td class="n">${i + 1}</td><td><b>${libelle(e)}</b>${e.remarques && html`<br/><span class="aide">${e.remarques}</span>`}</td><td class="nw">${e.periode || "—"}</td>
        <td><div class="badges" style="justify-content:flex-start">${classesEtape(e, cahier).map(k => { const et = etatDe(e, k), su = suiviDe(e, k) || {}; return html`<span key=${k} class=${"badge b-" + slug(et)} title=${et}>${k === SANS ? et : k}${et === "Vue" && su.fin ? " " + dateCourte(su.fin) : et === "En cours" ? " ►" : ""}</span>`; })}</div></td></tr>`)}</tbody>
    </table></div>

    ${codes.length ? html`<div class="tab-wrap"><table class="tab">
      <thead><tr><th>Code</th><th>Intitulé</th><th>Attendu (fin d\u2019année)</th><th>Degré</th></tr></thead>
      <tbody>${codes.map(it => html`<tr key=${it.code}><td class="code"><b>${it.code}</b></td><td>${it.intitule}</td><td>${it.attendu || "—"}</td>
        <td><span class=${"pilule m-" + CL_MARQUE[deg[it.code]]}>${NOM_DEG[deg[it.code]]}</span></td></tr>`)}</tbody>
    </table></div>` : html`<p class="vide">Aucun item coché dans cette séquence.</p>`}`}
  <//>`;
}

/* =================================================================== items */
function VueItems({ s, cahier, filtre, res }) {
  const [q, setQ] = useState("");
  const [fam, setFam] = useState("*");
  const [disc, setDisc] = useState("*");
  const [et, setEt] = useState("*");
  const periodes = periodesDuCahier(cahier);
  const nq = norm(q.trim());
  const FILTRES = [["*", "Tous les items"], ["nonprevu", "Non prévus"], ["partiel", "Prévus en partie"], ["nonvu", "Non vus"], ["cours", "En cours"], ["vus", "Vus ou évalués"], ["note", "Avec une remarque"]];
  const garder = it => {
    const r = res.items[it.code];
    if (fam !== "*" && it.famille !== fam) return false;
    if (disc !== "*" && it.discipline !== disc) return false;
    if (nq && !norm(`${it.code} ${it.court} ${it.intitule} ${it.attendu}`).includes(nq)) return false;
    switch (et) {
      case "nonprevu": return r.plan === "Non prévu";
      case "partiel": return r.plan === "Prévu en partie";
      case "nonvu": return r.vu === "Non vu";
      case "cours": return r.vu === "En cours";
      case "vus": return VUS.includes(r.vu);
      case "note": return !!(s.notes[it.code] || "").trim();
      default: return true;
    }
  };
  const liste = REF.filter(garder);
  return html`<div>
    <div class="titre-vue"><h1>Suivi des items${filtre !== "*" ? " · " + filtre : ""}</h1></div>
    <div class="outils" style="margin-top:0">
      <label class="recherche"><${Icone} n="chercher"/><span class="sr">Rechercher</span>
        <input id="rech-items" type="search" placeholder="Rechercher un item" value=${q} onInput=${ev => setQ(ev.target.value)}/></label>
      <select id="f-etat" class="select" value=${et} onChange=${ev => setEt(ev.target.value)} aria-label="État">${FILTRES.map(([v, l]) => html`<option value=${v} key=${v}>${l}</option>`)}</select>
      <select id="f-fam" class="select" value=${fam} onChange=${ev => setFam(ev.target.value)} aria-label="Famille"><option value="*">Toutes les familles</option>${FAMILLES.map(f => html`<option value=${f.nom} key=${f.nom}>${f.nom}</option>`)}</select>
      <select id="f-disc" class="select" value=${disc} onChange=${ev => setDisc(ev.target.value)} aria-label="Discipline"><option value="*">Toutes les disciplines</option>${DISCIPLINES.map(d => html`<option value=${d.nom} key=${d.nom}>${d.nom}</option>`)}</select>
      <span class="aide">${pl(liste.length, "item", "items")}</span>
    </div>
    ${liste.length ? html`<div class="items-liste">
      <div class="il-tete" aria-hidden="true"><span>Code</span><span>Item</span><span>Planification</span><span>Matière vue</span><span>Périodes</span><span>Étapes</span></div>
      ${FAMILLES.map(f => { const its = liste.filter(it => it.famille === f.nom); if (!its.length) return null; return html`<div key=${f.nom} style=${`--fam:var(--f-${f.cle})`}>
        <div class="il-fam">${f.nom}</div>
        ${its.map(it => { const r = res.items[it.code], note = (s.notes[it.code] || "").trim(); return html`<button type="button" key=${it.code} class="il" onClick=${() => ouvrirTiroir({ type: "item", code: it.code })}>
          <span class="il-code">${it.code}</span>
          <span class="il-nom">${it.court}<small>${it.discipline}</small></span>
          <span class="il-plan"><${Pilule} etat=${r.plan}/></span>
          <span class="il-vu"><${Pilule} etat=${r.vu}/></span>
          <span class="il-per">${periodes.length ? periodes.map((p, i) => html`<span key=${p} class=${r.periodes.has(p) ? "per-on" : "per-off"} title=${p + (r.periodes.has(p) ? " : travaillé" : " : pas travaillé")}>P${i + 1}<span class="sr">${r.periodes.has(p) ? " travaillé" : " non travaillé"}</span></span>`) : "—"}</span>
          <span class="il-ou"><span>${r.ou.length ? pl(r.ou.length, "étape", "étapes") : "—"}</span>${note && html`<span class="il-note" title=${note}><${Icone} n="note" t=${15}/><span class="sr">Remarque</span></span>`}</span>
        </button>`; })}
      </div>`; })}
    </div>` : html`<p class="vide">Aucun item ne correspond à ces filtres.</p>`}
  </div>`;
}
function DetailItem({ s, cahier, filtre, res, t }) {
  const it = PAR_CODE[t.code];
  const r = res.items[t.code];
  const [note, setNote] = useState(s.notes[t.code] || "");
  const noteRef = useRef(note); noteRef.current = note;
  const origine = useRef(s.notes[t.code] || "");
  const enregistre = () => { if ((noteRef.current || "").trim() !== (origine.current || "").trim()) { origine.current = noteRef.current; sauverNote(cahier.id, t.code, noteRef.current); } };
  const fermer = () => { enregistre(); fermerTiroir(); };
  const periodes = periodesDuCahier(cahier);
  if (!it) return null;
  return html`<${Tiroir} sur=${`${it.famille} · ${it.discipline}`} titre=${`${it.code} – ${it.court}`} onFermer=${fermer}>
    <div class="puces" style="margin-bottom:14px"><span class="aide" style="align-self:center">${filtre === "*" ? "Toutes les classes" : filtre}${NB}:</span><${Pilule} etat=${r.plan}/><${Pilule} etat=${r.vu}/></div>
    <p>${it.intitule}</p>
    <div class="attendu" style="margin-top:12px"><p class="attendu-lab">Attendu – à maîtriser en fin d\u2019année</p><p>${it.attendu || "—"}</p></div>
    <p class="bloc-titre">Travaillé dans</p>
    ${r.ou.length ? html`<ul class="ou-liste">${r.ou.map(o => html`<li class="ou" key=${o.e.id}>
      <span class=${"pilule m-" + CL_MARQUE[o.m]} title=${NOM_MARQUE[o.m]}>${o.m}</span>
      <div><p class="ou-seq">${o.e.sequence}${o.e.periode ? " · " + o.e.periode : ""}</p><p class="ou-et">${libelle(o.e)}</p></div>
      <div class="ou-cl">${o.lignes.map(l => html`<span key=${l.k} class=${"badge b-" + slug(l.etat)}>${l.k === SANS ? l.etat : l.k}${l.etat === "Vue" ? " ✔" : l.etat === "En cours" ? " ►" : ""}</span>`)}</div>
    </li>`)}</ul>` : html`<p class="vide">Aucune étape ne travaille encore cet item${filtre !== "*" ? " pour " + filtre : ""}.</p>`}
    ${periodes.length > 0 && html`<p class="bloc-titre">Périodes</p><div class="puces">${periodes.map(p => html`<span key=${p} class=${"pilule " + (r.periodes.has(p) ? "st-prevu" : "st-non")}>${r.periodes.has(p) ? "✓ " : ""}${p}</span>`)}</div>`}
    <p class="bloc-titre">Remarques, reste à faire</p>
    <textarea id="note-item" class="saisie" disabled=${s.lecture} value=${note} placeholder="Ce qui manque, une piste, un document à prévoir…" onInput=${ev => setNote(ev.target.value)} onBlur=${enregistre}></textarea>
  <//>`;
}

        : html`<p class="vide">Aucune période.</p>`}

function ChampCahier({ cahier, champ, label, lecture }) {
  const [v, setV] = useState(cahier[champ] || "");
  const orig = useRef(cahier[champ] || "");
  useEffect(() => { if (document.activeElement && document.activeElement.id === "cc-" + champ) return; setV(cahier[champ] || ""); orig.current = cahier[champ] || ""; }, [cahier[champ]]);
  const sauver = () => {
    const t = v.trim();
    if (champ === "nom" && !t) { setV(orig.current); return; }
    if (t !== orig.current) { orig.current = t; majCahier(cahier.id, { [champ]: t }); }
  };
  return html`<div class="champ"><label for=${"cc-" + champ}>${label}</label>
    <input id=${"cc-" + champ} class="saisie" value=${v} disabled=${lecture} onInput=${e => setV(e.target.value)} onBlur=${sauver} onKeyDown=${e => { if (e.key === "Enter") e.target.blur(); }}/></div>`;
}
function Ajout({ id, placeholder, existants, onAjout }) {
  const [v, setV] = useState("");
  const [err, setErr] = useState("");
  const ajouter = async ev => {
    ev.preventDefault();
    const e = nomValide(v, existants); if (e) { setErr(e); return; }
    setErr(""); const nom = v.trim(); setV("");
    await onAjout(nom);
  };
  return html`<form class="champ" onSubmit=${ajouter}>
    <div class="ajout"><label class="sr" for=${id}>Nom à ajouter</label><input id=${id} class="saisie" value=${v} placeholder=${placeholder} onInput=${e => { setV(e.target.value); setErr(""); }}/>
      <button type="submit" class="btn btn-sec"><${Icone} n="plus"/>Ajouter</button></div>
    ${err && html`<span class="erreur">${err}</span>`}
  </form>`;
}

/* =================================================================== dialogues */
function Dialogues({ s, cahier }) {
  const d = s.dialogue; if (!d) return null;
  switch (d.type) {
    case "suivi": return html`<${DialogueSuivi} key=${d.eid + d.k} s=${s} cahier=${cahier} d=${d}/>`;
    case "confirmer": return html`<${DialogueConfirmer} d=${d}/>`;
    case "renommerSeq": return html`<${DialogueRenommerSeq} s=${s} cahier=${cahier} d=${d}/>`;
    case "nom": return html`<${DialogueNom} s=${s} cahier=${cahier} d=${d}/>`;
    case "import": return html`<${DialogueImport} s=${s} d=${d}/>`;
    case "nouvelleAnnee": return html`<${DialogueNouveauCahier} s=${s} cahier=${cahier} depuis=${true}/>`;
    case "nouveauCahier": return html`<${DialogueNouveauCahier} s=${s} cahier=${cahier} depuis=${false}/>`;
    case "supprimerCahier": return html`<${DialogueSupprimerCahier} s=${s} cahier=${cahier}/>`;
    default: return null;
  }
}
function DialogueConfirmer({ d }) {
  const [envoi, setEnvoi] = useState(false);
  const faire = async () => { setEnvoi(true); fermerDialogue(); await d.faire(); };
  return html`<${Dialogue} titre=${d.titre} onFermer=${fermerDialogue} pied=${html`<button type="button" class="btn btn-sec" onClick=${fermerDialogue}>Annuler</button>
      <button type="button" class=${"btn " + (d.danger ? "btn-danger" : "btn-prim")} disabled=${envoi} onClick=${faire}>${d.bouton || "Confirmer"}</button>`}>
    <p>${d.texte}</p><//>`;
}
function DialogueRenommerSeq({ s, cahier, d }) {
  const [v, setV] = useState(d.titre);
  const t = v.trim();
  const existe = t !== d.titre && s.etapes.some(e => e.sequence === t);
  const ok = async () => { if (!t || t === d.titre) { fermerDialogue(); return; } fermerDialogue(); await renommerSequence(cahier.id, s.etapes, d.titre, t); };
  return html`<${Dialogue} titre="Renommer la séquence" onFermer=${fermerDialogue} pied=${html`<button type="button" class="btn btn-sec" onClick=${fermerDialogue}>Annuler</button><button type="button" class="btn btn-prim" disabled=${!t} onClick=${ok}>Renommer</button>`}>
    <div class="champ"><label for="ren-seq">Titre</label><input id="ren-seq" class="saisie" value=${v} onInput=${e => setV(e.target.value)} onKeyDown=${e => { if (e.key === "Enter") ok(); }}/></div>
    ${existe && html`<p class="aide">Une séquence porte déjà ce titre : les étapes y seront regroupées.</p>`}
  <//>`;
}
function DialogueNom({ s, cahier, d }) {
  const [v, setV] = useState(d.ancien);
  const [err, setErr] = useState("");
  const liste = d.genre === "classe" ? classesDuCahier(cahier) : periodesDuCahier(cahier);
  const ok = async () => {
    const e = nomValide(v, liste, d.ancien); if (e) { setErr(e); return; }
    const t = v.trim(); fermerDialogue(); if (t === d.ancien) return;
    if (d.genre === "classe") await renommerClasse(cahier, s.etapes, d.ancien, t); else await renommerPeriode(cahier, s.etapes, d.ancien, t);
  };
  return html`<${Dialogue} titre=${d.genre === "classe" ? `Renommer la classe ${d.ancien}` : `Renommer « ${d.ancien} »`} onFermer=${fermerDialogue}
    pied=${html`<button type="button" class="btn btn-sec" onClick=${fermerDialogue}>Annuler</button><button type="button" class="btn btn-prim" onClick=${ok}>Renommer</button>`}>
    <div class="champ"><label for="ren-nom">Nouveau nom</label><input id="ren-nom" class="saisie" value=${v} onInput=${e => { setV(e.target.value); setErr(""); }} onKeyDown=${e => { if (e.key === "Enter") ok(); }}/>
      ${err && html`<span class="erreur">${err}</span>`}</div>
  <//>`;

function DialogueImport({ s, d }) {

  const [annee, setAnnee] = useState(r.cahier.annee || anneeScolaire());

      fermerDialogue(); changerCahier(id); allerOnglet("vue"); toast("Cahier importé.");
    } catch (e) { console.error(e); setProg(null); toast(messageErreur(e), { type: "erreur" }); }
  };
  const st = r.stats;
  return html`<${Dialogue} titre="Importer le classeur" onFermer=${() => prog === null && fermerDialogue()}
    pied=${html`<button type="button" class="btn btn-sec" disabled=${prog !== null} onClick=${fermerDialogue}>Annuler</button>
      <button type="button" class="btn btn-prim" disabled=${prog !== null || !r.etapes.length && !Object.keys(r.notes).length} onClick=${creer}>${prog !== null ? `Création… ${prog}${NB}%` : "Créer le cahier"}</button>`}>
    <p><b>${r.fichier}</b></p>
    <ul class="leg" style="flex-direction:column;gap:4px">
      <li>${pl(st.lignes, "ligne lue", "lignes lues")} dans « Séquences », regroupées en ${pl(r.etapes.length, "étape", "étapes")}</li>
      <li>${r.cahier.classes.length ? "Classes : " + r.cahier.classes.join(", ") : "Aucune classe"} · ${r.cahier.periodes.length ? "Périodes : " + r.cahier.periodes.join(", ") : "aucune période"}</li>
      <li>${pl(Object.keys(r.notes).length, "remarque", "remarques")} sur les items</li>
      ${st.marquesIgnorees > 0 && html`<li class="erreur">${pl(st.marquesIgnorees, "marque ignorée", "marques ignorées")} (autre chose que x, p ou é)</li>`}
      ${st.sansClasse > 0 && html`<li class="erreur">${pl(st.sansClasse, "ligne sans classe", "lignes sans classe")} : l\u2019étape concernera toutes les classes</li>`}
      ${st.classesAjoutees.length > 0 && html`<li>Classes trouvées dans les lignes et ajoutées : ${st.classesAjoutees.join(", ")}</li>`}
    </ul>
    <div class="champs-2">
      <div class="champ"><label for="imp-nom">Nom du nouveau cahier</label><input id="imp-nom" class="saisie" value=${nom} onInput=${e => setNom(e.target.value)}/></div>
      <div class="champ"><label for="imp-annee">Année scolaire</label><input id="imp-annee" class="saisie" value=${annee} onInput=${e => setAnnee(e.target.value)}/></div>
    </div>
    <p class="aide">Le cahier ouvert n\u2019est pas modifié : l\u2019import crée un cahier à part.</p>
  <//>`;
}
function DialogueNouveauCahier({ s, cahier, depuis }) {
  const [nom, setNom] = useState(depuis && cahier ? cahier.nom : "FHGES 1re secondaire");
  const [annee, setAnnee] = useState(depuis && cahier ? anneeSuivante(cahier.annee) : anneeScolaire());
  const [garderClasses, setGC] = useState(true);
  const [garderNotes, setGN] = useState(true);
  const [prog, setProg] = useState(null);
  const creer = async () => {
    setProg(0);
    try {
      let params, etapes = [], notes = {};
      if (depuis && cahier) {
        params = { nom: nom.trim() || cahier.nom, annee: annee.trim(), enseignant: cahier.enseignant || "", ecole: cahier.ecole || "", classes: garderClasses ? classesDuCahier(cahier) : [], periodes: periodesDuCahier(cahier) };
        etapes = s.etapes.slice().sort(parOrdre).map((e, i) => { const c = copieEtape(e); return Object.assign(c, { suivi: {}, ordre: (i + 1) * 10, classes: garderClasses ? c.classes || null : null, creeLe: maintenant(), modifieLe: maintenant() }); });
        if (garderNotes) for (const k of Object.keys(s.notes)) if (s.notes[k]) notes[k] = s.notes[k];
      } else params = { nom: nom.trim() || "FHGES 1re secondaire", annee: annee.trim(), classes: [], periodes: ["Période 1", "Période 2", "Période 3"] };
      const id = await creerCahier(params, etapes, notes, (a, b) => setProg(Math.round(100 * a / b)));
      fermerDialogue(); changerCahier(id); toast("Cahier créé.");
    } catch (e) { console.error(e); setProg(null); toast(messageErreur(e), { type: "erreur" }); }
  };
  return html`<${Dialogue} titre=${depuis ? "Nouvelle année" : "Nouveau cahier vide"} onFermer=${() => prog === null && fermerDialogue()}
    pied=${html`<button type="button" class="btn btn-sec" disabled=${prog !== null} onClick=${fermerDialogue}>Annuler</button>
      <button type="button" class="btn btn-prim" disabled=${prog !== null} onClick=${creer}>${prog !== null ? `Création… ${prog}${NB}%` : "Créer le cahier"}</button>`}>
    ${depuis && html`<p>Le nouveau cahier reprend les ${pl(s.etapes.length, "étape", "étapes")} et leurs items, sans l\u2019avancement : tout repart à « Prévue ». Ce cahier-ci reste consultable.</p>`}
    <div class="champs-2">
      <div class="champ"><label for="nc-nom">Nom</label><input id="nc-nom" class="saisie" value=${nom} onInput=${e => setNom(e.target.value)}/></div>
      <div class="champ"><label for="nc-annee">Année scolaire</label><input id="nc-annee" class="saisie" value=${annee} onInput=${e => setAnnee(e.target.value)}/></div>
    </div>
    ${depuis && html`<label class="coche"><input type="checkbox" checked=${garderClasses} onChange=${e => setGC(e.target.checked)}/>Garder les mêmes classes</label>
      <label class="coche"><input type="checkbox" checked=${garderNotes} onChange=${e => setGN(e.target.checked)}/>Garder les remarques sur les items</label>`}
  <//>`;
}
function DialogueSupprimerCahier({ s, cahier }) {
  const [prog, setProg] = useState(null);
  const suppr = async () => {
    setProg(0);
    try { await supprimerCahier(cahier.id, (a, b) => setProg(Math.round(100 * a / b))); fermerDialogue(); toast("Cahier supprimé."); }
    catch (e) { console.error(e); setProg(null); toast(messageErreur(e), { type: "erreur" }); }
  };
  return html`<${Dialogue} titre="Supprimer ce cahier ?" onFermer=${() => prog === null && fermerDialogue()}
    pied=${html`<button type="button" class="btn btn-sec" disabled=${prog !== null || !s.exportDispo} onClick=${() => exporter(cahier)}><${Icone} n="telecharger"/>Exporter d\u2019abord</button>
      <button type="button" class="btn btn-danger" disabled=${prog !== null} onClick=${suppr}>${prog !== null ? `Suppression… ${prog}${NB}%` : "Supprimer définitivement"}</button>`}>
    <p>« ${cahier.nom}${cahier.annee ? " · " + cahier.annee : ""} » et ses ${pl(s.etapes.length, "étape", "étapes")} seront supprimés pour tous ceux qui ont accès à cette page. Cette action est définitive.</p>
  <//>`;
}

/* =================================================================== écrans d'accueil */
function Bienvenue({ s }) {
  const [nom, setNom] = useState("FHGES 1re secondaire");
  const [annee, setAnnee] = useState(anneeScolaire());
  const [envoi, setEnvoi] = useState(false);
  const creer = async ev => {
    ev.preventDefault(); setEnvoi(true);
    try { const id = await creerCahier({ nom: nom.trim() || "FHGES 1re secondaire", annee: annee.trim(), classes: [], periodes: ["Période 1", "Période 2", "Période 3"] }, [], {}); changerCahier(id); allerOnglet("parametres"); toast("Cahier créé : ajoute tes classes."); }
    catch (e) { console.error(e); toast(messageErreur(e), { type: "erreur" }); setEnvoi(false); }
  };
  return html`<div class="etat-plein">
    <h1>Planification et matière vue</h1>
    <p>Prévois tes séquences, coche les items du référentiel qu\u2019elles travaillent, et suis classe par classe ce qui a été vu. Tout commence par un cahier.</p>
    <div class="bandeau"><p>Ton cahier est enregistré dans ce navigateur, sur cet ordinateur : personne d\u2019autre ne le voit, mais il ne te suit pas d\u2019une machine à l\u2019autre et un effacement des données de navigation le supprime. Exporte le classeur Excel de temps en temps : c\u2019est ta sauvegarde, et il se réimporte ici.</p></div>
    ${s.lecture ? html`<p class="vide">Enregistrement indisponible dans ce navigateur.</p>` : html`<form class="encadre champs" style="width:100%;text-align:left" onSubmit=${creer}>
      <div class="champs-2">
        <div class="champ"><label for="bv-nom">Nom du cahier</label><input id="bv-nom" class="saisie" value=${nom} onInput=${e => setNom(e.target.value)}/></div>
        <div class="champ"><label for="bv-annee">Année scolaire</label><input id="bv-annee" class="saisie" value=${annee} onInput=${e => setAnnee(e.target.value)}/></div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <button type="submit" class="btn btn-prim" disabled=${envoi}>${envoi ? "Création…" : "Créer mon cahier"}</button>
        <button type="button" class="btn btn-sec" disabled=${!!s.occupe} onClick=${choisirFichierExcel}><${Icone} n="importer"/>Partir d\u2019un classeur Excel</button>
      </div>
    </form>`}
  </div>`;
}

/* =================================================================== application */
function Toasts({ toasts }) {
  return html`<div class="toasts" role="status" aria-live="polite">${toasts.map(t => html`<div key=${t.id} class=${"toast" + (t.type === "erreur" ? " erreur" : "")}>
    <span>${t.texte}</span>${t.action && html`<button type="button" onClick=${() => { store.set(x => ({ toasts: x.toasts.filter(y => y.id !== t.id) })); t.action.faire(); }}>${t.action.label}</button>`}</div>`)}</div>`;
}
function Cahier({ s, cahier }) {
  const classes = classesDuCahier(cahier);
  const filtre = classes.includes(s.filtre) ? s.filtre : "*";
  const res = useMemo(() => calculer(cahier, s.etapes, filtre), [cahier, s.etapes, filtre]);
  const parClasse = useMemo(() => classes.map(k => { const r = calculer(cahier, s.etapes, k); return { k, stats: r.etapesStats, vus: REF.filter(it => VUS.includes(r.items[it.code].vu)).length }; }), [cahier, s.etapes]);
  const t = s.tiroir;
  if (typeof window !== "undefined" && window.__PLANIF_TEST__) window.__planif.dernier = { res, filtre };
  return html`<${Barre} s=${s} cahier=${cahier} classes=${classes} filtre=${filtre}/>
    <main class="page contenu">
      ${s.lecture && html`<div class="bandeau"><p>Lecture seule : tu peux consulter ce cahier et l\u2019exporter, mais pas le modifier.</p></div>`}
      ${!s.etapesChargees ? html`<div class="etat-plein"><div class="roue" aria-hidden="true"></div><p>Chargement des séquences…</p></div>`
        : s.onglet === "sequences" ? html`<${VueSequences} s=${s} cahier=${cahier} filtre=${filtre}/>`
        : s.onglet === "items" ? html`<${VueItems} s=${s} cahier=${cahier} filtre=${filtre} res=${res}/>`
        : s.onglet === "parametres" ? html`<${VueParametres} s=${s} cahier=${cahier}/>`
        : html`<${VueEnsemble} s=${s} cahier=${cahier} filtre=${filtre} res=${res} parClasse=${parClasse}/>`}
    </main>
    ${t && t.type === "etape" && html`<${EditeurEtape} key=${"ed" + (t.id || "neuf") + (t.sequence || "")} s=${s} cahier=${cahier} t=${t}/>`}
    ${t && t.type === "fiche" && html`<${FicheSequence} s=${s} cahier=${cahier} t=${t}/>`}
    ${t && t.type === "item" && html`<${DetailItem} key=${"it" + t.code} s=${s} cahier=${cahier} filtre=${filtre} res=${res} t=${t}/>`}
    <${Dialogues} s=${s} cahier=${cahier}/>`;
}
function App() {
  const s = useStore();
  let corps;
  if (s.phase === "chargement") corps = html`<div class="etat-plein"><div class="roue" aria-hidden="true"></div><p>Ouverture du cahier…</p></div>`;
  else if (s.phase === "indispo") corps = html`<div class="etat-plein page"><h1>Planification FHGES</h1><p>Ce navigateur n\u2019autorise pas l\u2019enregistrement local, le cahier ne pourrait donc pas être conservé. Cela arrive en navigation privée, ou quand la page est ouverte directement depuis un fichier au lieu d\u2019une adresse web. Ouvre la page depuis son adresse https, dans une fenêtre normale.</p></div>`;
  else if (s.phase === "revoque") corps = html`<div class="etat-plein page"><h1>Accès modifié</h1><p>L\u2019accès à ce cahier a changé. Recharge la page.</p></div>`;
  else {
    const cahier = s.cahiers.find(c => c.id === s.cid) || null;
    corps = cahier ? html`<${Cahier} s=${s} cahier=${cahier}/>` : html`<${Barre} s=${s} cahier=${null} classes=${[]} filtre="*"/><main class="page"><${Bienvenue} s=${s}/></main><${Dialogues} s=${s} cahier=${null}/>`;
  }
  return html`${corps}<${Toasts} toasts=${s.toasts}/>`;
}

window.addEventListener("hashchange", () => { const h = ongletHash(); if (h && h !== store.s.onglet) store.set({ onglet: h }); });
if (window.__PLANIF_TEST__) window.__planif = { store, calculer, construireClasseur, lireClasseur, REF, grouperSequences, creerBaseLocale };
const racine = document.getElementById("app");
racine.textContent = "";
render(html`<${App}/>`, racine);
demarrer();
})();
</script>
